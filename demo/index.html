:root{--bg:#faf7f1;--surface:#ffffff;--surface2:#f3eee6;--text:#2a2522;--muted:#8c8178;--border:#e6dfd4;--accent:#9a7642;--accent-ink:#ffffff;--danger:#b9534b;--ok:#5d8a68;--warn:#c48a2f;--shadow:0 10px 30px rgba(60,45,30,.07);--serif:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:"Avenir Next","Segoe UI",Inter,system-ui,-apple-system,sans-serif;--r:18px}
[data-theme=blush]{--bg:#fbf3f1;--surface2:#f5e6e2;--border:#ecd6d0;--accent:#b0655e;--text:#33282a;--muted:#9a8280}
[data-theme=sage]{--bg:#f3f6f1;--surface2:#e7ede3;--border:#d7e0d1;--accent:#5f7f61;--text:#26302a;--muted:#7b887a}
[data-theme=champagne]{--bg:#f8f3e8;--surface:#fffdf9;--surface2:#f0e8d6;--border:#e5d9bf;--accent:#9d7f3f;--text:#332a1e;--muted:#8d7f68}
[data-theme=midnight]{--bg:#131620;--surface:#1c202b;--surface2:#252a37;--border:#313748;--accent:#cfae79;--accent-ink:#1a1408;--text:#ece7dd;--muted:#8f95a6;--shadow:0 10px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:500;letter-spacing:.005em;margin:0}
h1{font-size:30px}h2{font-size:24px}h3{font-size:22px;margin-bottom:14px}
p{margin:0 0 10px}a{color:var(--accent)}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 12px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
input[type=color]{padding:2px;height:40px}
textarea{resize:vertical}
.muted{color:var(--muted)}.small{font-size:12px}.sp{flex:1}.right{text-align:right}.center{text-align:center}
.mt{margin-top:16px}.mb{margin-bottom:16px}.hide{display:none!important}
#app{display:grid;grid-template-columns:262px 1fr;height:100vh;transition:grid-template-columns .25s}
#app.collapsed{grid-template-columns:76px 1fr}
#sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;z-index:30}
.brand{display:flex;align-items:center;gap:12px;padding:20px 16px 14px}
.logo{width:44px;height:50px;object-fit:contain;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.12))}

#onboard{position:fixed;inset:0;background:var(--bg);z-index:150;display:none;align-items:center;justify-content:center;padding:20px}#onboard.open{display:flex}
.ob{width:min(560px,100%);background:var(--surface);border-radius:26px;padding:40px;box-shadow:var(--shadow);border:1px solid var(--border)}.ob .ob-logo{height:150px;display:block;margin:-10px auto 10px}.ob h2{font-size:36px;font-style:italic;font-weight:400;margin-bottom:6px}.ob .st{display:flex;gap:6px;margin-bottom:22px}.ob .st i{height:3px;flex:1;background:var(--surface2);border-radius:99px}.ob .st i.on{background:var(--accent)}
.choice{border:1px solid var(--border);border-radius:16px;padding:18px;cursor:pointer;margin-bottom:10px}.choice:hover{border-color:var(--accent);background:var(--surface2)}.choice b{font-family:var(--serif);font-size:19px;font-weight:500;display:block}
.kbd{font-size:11px;background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:0 5px;color:var(--muted)}
.chk-row{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--border)}.chk-row.done span{text-decoration:line-through;color:var(--muted)}
.drag-over-line{outline:2px solid var(--accent);outline-offset:2px}
.print-only{display:none}

@media(max-width:1100px){.g4{grid-template-columns:1fr 1fr}.seat-wrap{grid-template-columns:220px 1fr;grid-template-rows:1fr auto}.seat-wrap .props{grid-column:1/-1;max-height:200px}.mood{columns:2}.hero{grid-template-columns:1fr}}
@media(max-width:820px){#app{grid-template-columns:1fr!important}#sidebar{position:fixed;left:-280px;top:0;bottom:0;width:262px;transition:left .25s}#sidebar.open{left:0;box-shadow:0 0 60px rgba(0,0,0,.3)}.only-mobile{display:grid}#top{padding:12px 14px}#top h1{font-size:20px}#content{padding:16px 14px 40px}.g3,.g4,.g2,.kb,.music-cols{grid-template-columns:1fr}.form{grid-template-columns:1fr}.f.inline{flex-wrap:wrap}.f.inline .f{flex:1 1 45%!important}.f.inline .f.chk{flex:0 0 auto!important}#top{flex-wrap:wrap}#top h1{order:0}.search-wrap{order:2;width:100%}#save-ind{order:1;margin-left:auto}.ob{max-height:96vh;overflow:auto;padding:24px}.seat-wrap{grid-template-columns:1fr;height:auto}.seat-wrap .panel{max-height:220px}.canvas-vp{height:60vh}.hero .names{font-size:38px}.hero .count{font-size:60px}.search-wrap{width:100%}.mood{columns:1}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

#print-area{display:none}
@media print{body *{visibility:hidden!important}#print-area,#print-area *{visibility:visible!important}#print-area{display:block;position:absolute;left:0;top:0;width:100%;padding:20px;color:#000;background:#fff;font-family:Georgia,serif}}
.split-a{display:grid;gap:16px;grid-template-columns:340px 1fr;align-items:start}
.split-b{display:grid;gap:16px;grid-template-columns:2fr 1fr}
.split-c{display:grid;gap:16px;grid-template-columns:1.4fr 1fr}
@media(max-width:1100px){.split-a,.split-b,.split-c{grid-template-columns:1fr}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.nav-i:focus-visible{outline-offset:-2px}

/* ---- RTL ---- */
[dir=rtl] #sidebar{border-right:none;border-left:1px solid var(--border)}
[dir=rtl] .brand{flex-direction:row}
[dir=rtl] .nav-i .b{margin-left:0;margin-right:auto}
[dir=rtl] .f.inline{flex-direction:row}
[dir=rtl] .dt th,[dir=rtl] .dt td{text-align:right}
[dir=rtl] .dt th.num,[dir=rtl] .dt td.num{text-align:left}
[dir=rtl] .right{text-align:left}
[dir=rtl] .kcard{border-left:none;border-right:3px solid var(--border)}
[dir=rtl] .kcard.pri-High{border-right-color:var(--danger)}
[dir=rtl] .kcard.pri-Medium{border-right-color:var(--warn)}
[dir=rtl] .kcard.pri-Low{border-right-color:var(--ok)}
[dir=rtl] .attn{border-left:none;border-right:3px solid var(--warn)}
[dir=rtl] .tl-i{border-left:none;border-right:3px solid var(--c)}
[dir=rtl] .note.pin{border-left:none;border-right:3px solid var(--accent)}
/* canvases keep a fixed coordinate system regardless of text direction */
[dir=rtl] .canvas-vp,[dir=rtl] .canvas,[dir=rtl] .seat-wrap,[dir=rtl] .mood{direction:ltr}
[dir=rtl] .seat-wrap .panel,[dir=rtl] .seat-wrap .props{direction:rtl}

const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};

const fmtDate=iso=>{const d=iso?dparts(iso):null;if(!d)return'';const F=FB_CAL[LANG];if(F)return `${d.getDate()} ${F.m[d.getMonth()]} ${d.getFullYear()}`;try{return dtf({day:'numeric',month:'long',year:'numeric'},'long').format(d)}catch(e){return iso}};

function csv(rows,sep=';'){return '\uFEFF'+rows.map(r=>r.map(v=>{v=String(v??'');if(/^[=+\-@]/.test(v))v="'"+v;return new RegExp('["'+sep+'\\n]').test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(sep)).join('\r\n')}
function parseCSV(t){t=t.replace(/^\uFEFF/,'');const first=t.split(/\r?\n/)[0]||'';const sep=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':(first.match(/\t/g)||[]).length>(first.match(/,/g)||[]).length?'\t':',';const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===sep){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}if(f!==''||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(c=>c.trim()!==''))}

 S.tables.forEach(tb=>{if(!valid.has(tb.id))return;const gs=sortBy(S.guests.filter(g=>g.tableId===tb.id),g=>(g.id===priorityId?-1:num(g.seat)));const taken={};gs.forEach(g=>{const size=psize(g);let st=num(g.seat);let clash=false;for(let i=0;i<size;i++)if(taken[st+i])clash=true;if(clash){st=0;for(;;){let ok=true;for(let i=0;i<size;i++)if(taken[st+i]){ok=false;break}if(ok)break;st++}g.seat=st;moved++}for(let i=0;i<size;i++)taken[st+i]=true})});
 if(!silent&&(moved||un))toast(t('Seating adjusted: {a} moved, {b} unassigned',{a:moved,b:un}),'warn');if(!silent){const full=S.tables.filter(tb=>valid.has(tb.id)&&occ(tb)>num(tb.capacity));if(full.length)toast(t('TABLE FULL — {t} has {a} of {b} seats used',{t:full[0].name,a:occ(full[0]),b:full[0].capacity}),'bad')}return moved+un}

const SG=64;
function geo(tb){const n=Math.max(num(tb.capacity),1);let w,h;switch(tb.shape){case 'stage':w=280;h=80;break;case 'square':w=h=Math.max(96,Math.ceil(n/4)*SG);break;case 'rect':w=Math.max(120,Math.ceil(n/2)*SG);h=76;break;case 'sweetheart':w=130;h=64;break;case 'head':w=Math.max(160,n*SG);h=64;break;default:w=h=Math.max(100,Math.round(n*15))}return{w,h}}
function seatPts(tb,m){const{w,h}=geo(tb),p=[];if(tb.shape==='stage')return p;if(tb.shape==='round'||!tb.shape){const r=w/2+30;for(let i=0;i<m;i++){const a=-Math.PI/2+i*2*Math.PI/m;p.push({x:Math.cos(a)*r,y:Math.sin(a)*r})}}
 else if(tb.shape==='square'){const off=w/2+30;for(let i=0;i<m;i++){const s=i%4,k=Math.floor(i/4),cnt=Math.ceil((m-s)/4),pos=(k-(cnt-1)/2)*SG;p.push(s===0?{x:pos,y:-off}:s===1?{x:off,y:pos}:s===2?{x:-pos,y:off}:{x:-off,y:-pos})}}
 else if(tb.shape==='rect'){const top=Math.ceil(m/2),bot=m-top;for(let i=0;i<m;i++){if(i<top)p.push({x:(i-(top-1)/2)*SG,y:-(h/2+30)});else{const j=i-top;p.push({x:(j-(bot-1)/2)*SG,y:h/2+30})}}}
 else if(tb.shape==='sweetheart'){for(let i=0;i<m;i++)p.push({x:(i-(m-1)/2)*SG,y:-(h/2+30)})}
 else{for(let i=0;i<m;i++)p.push({x:(i-(m-1)/2)*SG,y:h/2+30})}
 const a=(num(tb.rot)||0)*Math.PI/180,c=Math.cos(a),s=Math.sin(a);return p.map(q=>({x:q.x*c-q.y*s,y:q.x*s+q.y*c}))}
function tableBox(tb){const{w,h}=geo(tb);const R=Math.hypot(w/2,h/2)+30+28;return{w,h,R,side:R*2+44}}

function firstFree(tb,size,list){const m=slotMap(tb,list);let st=0;for(;;){let ok=true;for(let i=0;i<size;i++)if(m[st+i]){ok=false;break}if(ok)return st;st++}}

function readImage(file,max=900){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};im.onerror=()=>res(null);im.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(file)})}

function gsearch(q){q=q.toLowerCase();const r=[];const add=(k,tt,s,page,act,id)=>r.push({k,t:tt,s,page,act,id});
 S.guests.forEach(g=>{if((gname(g)+' '+(g.group||'')+' '+(g.email||'')).toLowerCase().includes(q))add(t('Guest'),gname(g),t(g.rsvp)+(g.group?' · '+g.group:''),'guests','guestEdit',g.id)});
 S.tasks.forEach(x=>{if((x.title+' '+(x.notes||'')).toLowerCase().includes(q))add(t('Task'),x.title,t(x.category)+(x.due?' · '+fmtShort(x.due):''),'checklist','taskEdit',x.id)});
 S.vendors.forEach(v=>{if((v.company+' '+(v.contact||'')+' '+(v.notes||'')).toLowerCase().includes(q))add(t('Vendor'),v.company,t(v.category||'')+' · '+t(v.status),'vendors','vendorEdit',v.id)});
 S.orders.forEach(o=>{if((o.item+' '+(o.store||'')).toLowerCase().includes(q))add(t('Order'),o.item,t(o.status),'payments','orderEdit',o.id)});
 S.notes.forEach(n=>{if((n.title+' '+n.text).toLowerCase().includes(q))add(t('Note'),n.title,t(n.category),'notes','noteEdit',n.id)});
 S.music.forEach(m=>{if((m.song+' '+(m.artist||'')).toLowerCase().includes(q))add(t('Music'),m.song,(m.artist?m.artist+' · ':'')+t(m.moment||''),'music','musicEdit',m.id)});
 S.shots.forEach(x=>{if((x.title+' '+(x.notes||'')).toLowerCase().includes(q))add(t('Photography'),x.title,t(x.category||''),'photo','shotEdit',x.id)});
 S.party.forEach(p=>{if((p.name+' '+(p.tasks||'')).toLowerCase().includes(q))add(t('Wedding Party'),p.name,t(p.role||''),'party','partyEdit',p.id)});
 S.inspiration.forEach(c=>{if((c.title+' '+(c.notes||'')).toLowerCase().includes(q))add(t('Inspiration'),c.title,t(c.category||''),'inspiration','inspEdit',c.id)});
 S.honeymoon.items.forEach(i=>{if((i.name+' '+(i.notes||'')).toLowerCase().includes(q))add(t('Honeymoon'),i.name,t(i.type||''),'honeymoon','hmEdit',i.id)});
 S.budget.forEach(b=>{if((b.item+' '+(b.vendor||'')).toLowerCase().includes(q))add(t('Budget'),b.item,(b.vendor?b.vendor+' · ':'')+money(bCommitted(b)),'budget','budgetEdit',b.id)});
 S.payments.forEach(p=>{if((p.vendor+' '+p.label).toLowerCase().includes(q))add(t('Payment'),p.vendor+' — '+p.label,money(p.amount),'payments','payEdit',p.id)});
 return r.slice(0,20)}
