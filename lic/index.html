<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Toy Planlayıcı — kodlar</title>
<style>:root{--a:#9a7642;--bg:#faf7f1;--t:#2a2522;--m:#8c8178;--b:#e6dfd4}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t);padding:18px;max-width:520px;margin:auto}h1{font-size:22px;margin:6px 0 14px}h2{font-size:15px;margin:22px 0 8px;color:var(--m);text-transform:uppercase;letter-spacing:.06em}label{display:block;font-size:12px;color:var(--m);margin:10px 0 4px}input,select{width:100%;font-size:17px;padding:12px;border:1px solid var(--b);border-radius:12px;background:#fff}button{width:100%;font-size:17px;padding:14px;border:0;border-radius:12px;background:var(--a);color:#fff;margin-top:12px;font-weight:600}button.g{background:#fff;color:var(--t);border:1px solid var(--b)}button:disabled{opacity:.5}.codes{background:#fff;border:1px solid var(--b);border-radius:12px;padding:12px;margin-top:12px;font-family:ui-monospace,Menlo,monospace;font-size:17px;line-height:1.9;white-space:pre-wrap;user-select:all}.row{display:flex;gap:8px}.row>*{flex:1}.msg{margin-top:10px;font-size:14px;color:#b9534b;min-height:18px}table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}td,th{padding:7px 6px;border-bottom:1px solid var(--b);text-align:left;vertical-align:top}th{color:var(--m);font-weight:500}.ok{color:#5d8a68}.small{font-size:12px;color:var(--m)}details{margin-top:14px}summary{cursor:pointer;color:var(--m)}</style></head><body>
<h1>Toy Planlayıcı — коды</h1>
<details id="setup"><summary>Настройка (один раз)</summary><label>Admin secret</label><input id="sec" type="password" placeholder="ADM-…" autocomplete="off"><button class="g" onclick="saveSec()">Сохранить на этом устройстве</button><p class="small">Секрет хранится только в памяти этого браузера.</p></details>
<h2>Выдать коды</h2>
<label>Блогер / источник</label><input id="bl" placeholder="aysel_blogger" list="bls"><datalist id="bls"></datalist>
<div class="row"><div><label>Сколько</label><select id="n"><option>1</option><option>2</option><option>3</option><option selected>5</option><option>10</option><option>20</option></select></div><div><label>&nbsp;</label><button onclick="gen()" id="genb">Создать</button></div></div>
<div id="out"></div><div class="msg" id="msg"></div>
<h2>Статистика</h2><button class="g" onclick="stats()">Показать по блогерам</button><div id="st"></div>
<h2>Коды</h2><button class="g" onclick="list()">Показать последние 200</button><div id="ls"></div>
<h2>Сбросить / удалить</h2><input id="cd" placeholder="TP-XXXX-XXXX-XXXX" style="text-transform:uppercase"><div class="row"><button class="g" onclick="act('reset')">Сбросить (новая свадьба)</button><button class="g" onclick="act('delete')" style="color:#b9534b">Удалить</button></div>
<script>
const URL_='https://smeunswozxgjjhbawzue.supabase.co/rest/v1/rpc/admin',KEY='sb_publishable_qGRhe1qyTipSSMA-70714Q_aDhlkNEm';
const $=s=>document.querySelector(s);const sec=()=>localStorage.getItem('lic-secret')||'';
if(!sec())$('#setup').open=true;
function saveSec(){localStorage.setItem('lic-secret',$('#sec').value.trim());$('#setup').open=false;msg('Сохранено','ok');stats()}
function msg(t,c){const m=$('#msg');m.textContent=t;m.style.color=c==='ok'?'#5d8a68':'#b9534b'}
async function rpc(b){if(!sec()){$('#setup').open=true;throw new Error('Введите admin secret')}const r=await fetch(URL_,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+KEY},body:JSON.stringify({p_secret:sec(),...b})});const j=await r.json();if(!j.ok)throw new Error(j.err==='forbidden'?'Неверный секрет':(j.err||'Ошибка'));return j}
async function gen(){const bl=$('#bl').value.trim();if(!bl)return msg('Укажи блогера');$('#genb').disabled=true;msg('');try{const j=await rpc({p_action:'new',p_blogger:bl,p_n:+$('#n').value});const codes=j.codes||[];$('#out').innerHTML=`<div class="codes" id="codes">${codes.join('\n')}</div><div class="row"><button class="g" onclick="copyC()">Копировать</button><button class="g" onclick="shareC()">Поделиться</button></div>`;localStorage.setItem('lic-bl',bl);msg(codes.length+' код(ов) для '+bl,'ok')}catch(e){msg(e.message)}$('#genb').disabled=false}
function codesText(){return $('#codes').textContent}
async function copyC(){try{await navigator.clipboard.writeText(codesText());msg('Скопировано','ok')}catch(e){msg('Выдели текст и скопируй вручную')}}
async function shareC(){if(navigator.share)try{await navigator.share({text:'Toy Planlayıcı aktivləşdirmə kodları:\n'+codesText()})}catch(e){}else copyC()}
async function stats(){try{const j=await rpc({p_action:'stats'});const rows=j.rows||[];$('#st').innerHTML=rows.length?`<table><tr><th>Блогер</th><th>Выдано</th><th>Активировано</th></tr>${rows.map(r=>`<tr><td>${esc(r.blogger)}</td><td>${r.issued}</td><td>${r.activated}</td></tr>`).join('')}</table>`:'<p class="small">Пока нет кодов</p>';$('#bls').innerHTML=rows.map(r=>`<option value="${esc(r.blogger)}">`).join('')}catch(e){msg(e.message)}}
async function list(){try{const j=await rpc({p_action:'list'});const rows=j.rows||[];$('#ls').innerHTML=rows.length?`<table><tr><th>Код</th><th>Блогер</th><th>Свадьба</th></tr>${rows.map(r=>`<tr><td style="font-family:monospace">${esc(r.code)}</td><td>${esc(r.blogger)}</td><td>${r.used_at?`<span class="ok">${esc(r.bride)} &amp; ${esc(r.groom)}</span><br><span class="small">${r.wdate} · ${r.used_at.slice(0,10)}</span>`:'<span class="small">не активирован</span>'}</td></tr>`).join('')}</table>`:'<p class="small">Пусто</p>'}catch(e){msg(e.message)}}
async function act(a){const c=$('#cd').value.trim().toUpperCase();if(!c)return msg('Введи код');if(!confirm((a==='reset'?'Сбросить ':'Удалить ')+c+'?'))return;try{const j=await rpc({p_action:a,p_code:c});msg(j.ok?(a==='reset'?'Сброшен':'Удалён'):'Код не найден',j.ok?'ok':'');list()}catch(e){msg(e.message)}}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#bl').value=localStorage.getItem('lic-bl')||'';if(sec())stats();
</script></body></html>
