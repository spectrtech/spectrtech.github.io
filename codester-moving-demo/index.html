.lbl-items li.more{color:#666}.lbl-items li.more:before{display:none}
.lbl-foot{font-size:calc(var(--u)*3.1);color:#555;display:flex;gap:calc(var(--u)*2);align-items:center;justify-content:space-between;border-top:calc(var(--u)*.25) solid #ddd;padding-top:calc(var(--u)*1.4);margin-top:calc(var(--u)*1.4)}
.lbl-foot .gift{font-weight:700;color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:calc(var(--u)*1.4);min-width:0}
.lbl-foot .gift img{height:calc(var(--u)*5);max-width:calc(var(--u)*20);object-fit:contain}
.lbl-foot .brd{color:#09757a;font-weight:700;white-space:nowrap}
.lbl-qr{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lbl-qr svg{display:block}
.lbl-scan{font-size:calc(var(--u)*3.3);font-weight:700;text-align:center;margin-top:calc(var(--u)*1);line-height:1.15}
.lbl.v .lbl-in{flex-direction:column}
.lbl.v .lbl-qr{margin-top:auto}
.sign{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--rc);color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;text-align:center;padding:20mm}
.sign .s-name{font-size:30mm;font-weight:900;line-height:1;word-break:break-word;text-transform:uppercase}
.sign .s-sub{font-size:9mm;font-weight:700;margin-top:10mm;opacity:.92}
.sign .s-foot{position:absolute;bottom:12mm;font-size:5mm;opacity:.85}
.inv{padding:14mm 14mm;font-size:10.5pt;color:#111}
.inv h1{font-size:18pt;margin:0 0 2mm}
.inv .meta{color:#555;margin-bottom:6mm}
.inv table{width:100%;border-collapse:collapse}
.inv th,.inv td{border:.25mm solid #bbb;padding:1.6mm 2mm;text-align:start;vertical-align:top}
.inv th{background:#f0f2f4}
.inv td.n{font-weight:800;font-size:13pt;white-space:nowrap}
.inv .rc{display:inline-block;width:3mm;height:3mm;border-radius:50%;margin-inline-end:1.5mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
@media print{
 body{background:#fff}
 #app,.modal-bg,.toast,.onb,.lightbox{display:none!important}
 #print{display:block}
 #print .sheet{page-break-after:always;break-after:page;box-shadow:none;margin:0}
 #print .sheet:last-child{page-break-after:auto;break-after:auto}
}

@media (max-width:520px){.ed-top{grid-template-columns:1fr 1fr}.ed-top .fld:first-child{grid-column:1/-1}.row .btn{white-space:normal}.hero{padding:18px}.stats .stat .v{font-size:22px}.langs{grid-template-columns:1fr 1fr}}
@media (max-width:360px){main{padding:14px 10px 40px}.card{padding:14px}}
.grid>*{min-width:0}
@media (max-width:860px){.btn{white-space:normal;text-align:center}.task .due{white-space:normal;text-align:end;max-width:42%}.task .tt{min-width:0;overflow-wrap:anywhere}}
</style>

function roomById(id){for(var i=0;i<S.rooms.length;i++)if(S.rooms[i].id===id)return S.rooms[i];return null;}

function lum(hex){var h=(hex||'#777').replace('#','');if(h.length===3)h=h.replace(/(.)/g,'$1$1');var n=parseInt(h,16);var r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255;function f(c){return c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4);}return .2126*f(r)+.7152*f(g)+.0722*f(b);}
function onColor(hex){return lum(hex)>.45?'#111':'#fff';}
function parseD(s){if(!s)return null;var p=String(s).split('-');if(p.length!==3)return null;var d=new Date(+p[0],+p[1]-1,+p[2]);return isNaN(d)?null:d;}

function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
/* Money parser: last "." or "," is the decimal separator when the format says so; other separators are thousands. */
function num(v){
 var s=String(v==null?'':v).trim();if(!s)return 0;
 var neg=/^[-−(]/.test(s)||/-$/.test(s);
 s=s.replace(/[\s  '’_]/g,'').replace(/[^0-9.,]/g,'');
 if(!s)return 0;
 var ld=s.lastIndexOf('.'),lc=s.lastIndexOf(',');
 var res;
 if(ld>=0&&lc>=0){var dec=ld>lc?'.':',',th=dec==='.'?',':'.';res=s.split(th).join('');res=res.replace(dec,'.');}
 else if(ld>=0||lc>=0){
  var sep=ld>=0?'.':',',parts=s.split(sep);
  if(parts.length>2){res=parts.join('');}
  else{var intp=parts[0],frac=parts[1];
   if(frac.length===3&&intp.length>=1&&intp.length<=3&&!/^0/.test(intp))res=intp+frac; /* 1,200 / 1.200 → thousands */
   else res=(intp||'0')+'.'+frac;}
 }else res=s;
 var n=parseFloat(res);if(!isFinite(n))return 0;return neg?-n:n;
}
function money(n){var s;try{s=new Intl.NumberFormat(locale(),{maximumFractionDigits:2}).format(n);}catch(e){s=String(n);}var c=S.cur||'';return ['en','zh','hi','ar'].indexOf(lang)>=0?c+s:s+' '+c;}

function shrinkImage(dataUrl,max,type,q){return new Promise(function(res){var im=new Image();im.onload=function(){var w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,max/Math.max(w,h));var c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));var x=c.getContext('2d');if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);}x.drawImage(im,0,0,c.width,c.height);try{res(c.toDataURL(type||'image/jpeg',q||.82));}catch(e){res(null);}};im.onerror=function(){res(null);};im.src=dataUrl;});}

/* ---------- printed state (label signature) ---------- */
/* Signature = everything printed on the label or encoded in the QR, built from the same functions that render them
   (qrText covers language, box number, room name, flags, visible items + qty, packedAt date, gift line). */
function labelSig(b){
 var r=roomById(b.roomId),l=S&&S.lang||lang;
 return JSON.stringify([l,qrText(b,l),roomColor(r),roomName(r,l),visItems(b).map(itemLine),FLAGS.filter(function(f){return b[f[0]];}).map(function(f){return f[0];}),giftOn()?[CFG.gift.name,CFG.gift.phone||'',CFG.gift.logo?1:0]:0]);
}
function markPrinted(b){b.printed=true;b.printedSig=labelSig(b);}
function invalidatePrintedForBox(b){if(b){b.printed=false;delete b.printedSig;}}
/* Central rule: any change to data shown on a label/QR (box, items, flags, room name/colour) makes the box "not printed". */
function syncPrinted(){if(!S)return;S.boxes.forEach(function(b){if(b.printed&&b.printedSig!==labelSig(b))invalidatePrintedForBox(b);});}
function isPrinted(b){return !!b.printed&&b.printedSig===labelSig(b);}

/* ---------- status ---------- */
function applyStatus(b,prev,next){
 b.status=next;
 if(next==='packing')delete b.packedAt;          /* back to packing → packed date no longer true */
 else if(prev==='packing')b.packedAt=Date.now(); /* first step out of packing → new packed date */
}

/* ---------- QR ---------- */
function qrText(b,l){
 l=l||lang;var r=roomById(b.roomId);
 var out=[tl(l,'L_box')+' '+b.no+' — '+roomName(r,l).toUpperCase()];
 var fl=FLAGS.filter(function(f){return b[f[0]];}).map(function(f){return tl(l,f[1]);});
 if(fl.length)out.push(fl.join(' · '));
 out.push('');
 visItems(b).forEach(function(i,n){out.push((n+1)+'. '+itemLine(i));});
 var tail=[];
 if(b.packedAt){try{tail.push(tl(l,'L_packed')+' '+new Intl.DateTimeFormat((I18N[l]||I18N.en)._locale,{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(b.packedAt)));}catch(e){}}
 if(giftOn())tail.push(tl(l,'L_gift',{name:CFG.gift.name}));
 if(tail.length){out.push('');out=out.concat(tail);}
 return out.join('\n');
}
/* Build a QR with the whole text, choosing error correction so that each module is at least MIN_MODULE_MM wide. */
var qrCache={};
function qrFor(text,sizeMm){
 var key=sizeMm.toFixed(2)+'|'+text;if(qrCache.hasOwnProperty(key))return qrCache[key];
 var res=null,ecs=['M','L'];
 for(var i=0;i<ecs.length&&!res;i++){
  try{var q=qrcode(0,ecs[i]);q.addData(text,'Byte');q.make();var n=q.getModuleCount();var mod=sizeMm/(n+4);if(mod>=MIN_MODULE_MM)res={q:q,n:n,mod:mod,ec:ecs[i]};}catch(e){}
 }
 qrCache[key]=res;return res;
}
function qrSvg(fit,sizeMm){
 var q=fit.q,n=fit.n,d='';
 for(var r=0;r<n;r++){var c=0;while(c<n){if(q.isDark(r,c)){var s=c;while(c<n&&q.isDark(r,c))c++;d+='M'+s+' '+r+'h'+(c-s)+'v1h-'+(c-s)+'z';}else c++;}}
 var m=2,W=n+m*2;
 return '<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="QR" viewBox="'+(-m)+' '+(-m)+' '+W+' '+W+'" width="'+sizeMm+'mm" height="'+sizeMm+'mm" shape-rendering="crispEdges"><rect x="'+(-m)+'" y="'+(-m)+'" width="'+W+'" height="'+W+'" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>';
}
function labelGeom(L){
 var vert=L.w<L.h,u=(vert?L.w:L.h)/100,bar=5*u,pad=4.5*u;
 var qs=vert?Math.min((L.w-bar-pad*2)*0.52,L.h*0.38):Math.min(L.h*0.74,L.w*0.42);
 return {vert:vert,u:u,qs:qs};
}
function qrFitsBox(b,L){return !!qrFor(qrText(b),labelGeom(L).qs);}

/* validate + persist the box in the editor; returns the saved box or null */
function saveBox(){
 var e=ED;if(!e)return null;
 var no=parseInt(e.no,10);

 if(S.boxes.some(function(b){return b.id!==e.id&&b.no===no;})){toast(t('box')+' '+no+' ≠');return null;}
 e.no=no;
 if(!roomById(e.roomId))e.roomId=S.rooms[0].id;
 e.items=e.items.filter(function(i){return (i.n||'').trim();}).map(function(i){return {n:i.n.trim(),q:qtyOf(i),hide:!!i.hide};});
 var prevStatus=EDorig?EDorig.status:'packing';
 if(e.status!==prevStatus)applyStatus(e,prevStatus,e.status);
 if(EDorig){EDorig.photos.filter(function(p){return e.photos.indexOf(p)<0;}).forEach(phDel);}
 var isNew=e._new;delete e._new;delete e._added;delete e._sid;
 if(isNew)S.boxes.push(e);else{for(var i=0;i<S.boxes.length;i++)if(S.boxes[i].id===e.id)S.boxes[i]=e;}
 S.nextNo=Math.max(S.nextNo,e.no+1);
 save();ED=null;EDorig=null;renderModal();render();toast(t('saved'));
 return findById(S.boxes,e.id);
}

/* ---------- backup validation (strict, nothing trusted) ---------- */
var ID_RE=/^[A-Za-z0-9_-]{1,64}$/,IMG_RE=/^data:image\/(png|jpe?g|webp|gif);base64,[A-Za-z0-9+\/=]+$/;
function vStr(v,max){if(v==null)return '';if(typeof v==='number'&&isFinite(v))v=String(v);if(typeof v!=='string')throw 0;return v.slice(0,max);}
function vBool(v){return v===true;}
function vHex(v){if(typeof v!=='string')throw 0;var m=/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(v.trim());if(!m)throw 0;var h=m[1];if(h.length===3)h=h.replace(/(.)/g,'$1$1');return '#'+h.toUpperCase();}
function vId(v){if(typeof v!=='string'||!ID_RE.test(v))throw 0;return v;}
function vImg(v,maxLen){if(v==null||v==='')return '';if(typeof v!=='string'||v.length>maxLen||!IMG_RE.test(v))throw 0;return v;}
function vObj(v){if(!v||typeof v!=='object'||Array.isArray(v))throw 0;return v;}
function vArr(v){if(!Array.isArray(v))throw 0;return v;}
function vKey(k,re){return typeof k==='string'&&re.test(k)&&I18N.en.hasOwnProperty(k)?k:null;}
function validateBackup(d){
 try{
  vObj(d);if(d.app!=='spectrtech-moving')throw 0;
  var ver=+d.v;if(!(ver>=1&&ver<=2))throw 0;
  var s=vObj(d.state);if(s.app!=null&&s.app!=='spectrtech-moving')throw 0;
  if(s.lang!=null&&LANGS.indexOf(s.lang)<0)throw 0;
  var out=freshState(LANGS.indexOf(s.lang)>=0?s.lang:lang);
  out.onboarded=true;
  out.mode=s.mode==='realtor'&&!giftOn()?'realtor':'self';
  var mv=vObj(s.move);
  out.move={date:/^\d{4}-\d{2}-\d{2}$/.test(mv.date||'')&&parseD(mv.date)?mv.date:'',from:vStr(mv.from,200),to:vStr(mv.to,200)};
  if(s.cur!=null)out.cur=vStr(s.cur,5);
  var rooms=vArr(s.rooms);if(!rooms.length||rooms.length>60)throw 0;
  var rid={};
  out.rooms=rooms.map(function(r){vObj(r);var id=vId(r.id);if(rid[id])throw 0;rid[id]=1;
   var k=typeof r.k==='string'&&I18N.en.hasOwnProperty('r_'+r.k)?r.k:null;
   var o={id:id,color:vHex(r.color)};if(k)o.k=k;else{o.name=vStr(r.name,40).trim();if(!o.name)throw 0;}return o;});
  var boxes=vArr(s.boxes);if(boxes.length>5000)throw 0;
  var bid={},bno={},photoIds={};
  out.boxes=boxes.map(function(b){vObj(b);var id=vId(b.id);if(bid[id])throw 0;bid[id]=1;
   var no=+b.no;if(!(no>0&&no<1e6&&Math.floor(no)===no)||bno[no])throw 0;bno[no]=1;
   if(typeof b.roomId!=='string'||!rid[b.roomId])throw 0;
   if(STATUSES.indexOf(b.status)<0)throw 0;
   var items=vArr(b.items);if(items.length>500)throw 0;
   var o={id:id,no:no,roomId:b.roomId,status:b.status,note:vStr(b.note,1000),
    items:items.map(function(i){vObj(i);var q=parseInt(i.q,10);return {n:vStr(i.n,120),q:q>0&&q<100000?q:1,hide:vBool(i.hide)};}),
    photos:vArr(b.photos==null?[]:b.photos).map(function(p){var pid=vId(p);photoIds[pid]=1;return pid;}),
    fragile:vBool(b.fragile),up:vBool(b.up),first:vBool(b.first),heavy:vBool(b.heavy)};
   if(typeof b.created==='number'&&isFinite(b.created))o.created=b.created;
   if(typeof b.packedAt==='number'&&isFinite(b.packedAt))o.packedAt=b.packedAt;
   if(b.printed===true)o.printed=true;
   if(typeof b.printedSig==='string'&&b.printedSig.length<20000)o.printedSig=b.printedSig;
   return o;});
  var maxNo=out.boxes.reduce(function(a,b){return Math.max(a,b.no);},0);
  out.nextNo=Math.max(maxNo+1,(+s.nextNo>0&&+s.nextNo<1e6)?Math.floor(+s.nextNo):1);
  function list(arr,re,extra){var seen={};return vArr(arr).map(function(x){vObj(x);var id=vId(x.id);if(seen[id])throw 0;seen[id]=1;var o={id:id,done:vBool(x.done)};var k=vKey(x.k,re);if(k)o.k=k;else{o.text=vStr(x.text,300);}if(extra)extra(o,x);return o;});}
  out.tasks=list(s.tasks,/^t\d+$/,function(o,x){if(PHASE_IDS.indexOf(x.p)<0)throw 0;o.p=x.p;});
  out.addr=list(s.addr,/^a\d+$/);
  out.budget=list(s.budget,/^b\d+$/,function(o,x){delete o.done;o.plan=vStr(x.plan,30);o.act=vStr(x.act,30);});
  var rl=s.realtor==null?{}:vObj(s.realtor);
  out.realtor={name:vStr(rl.name,120),agency:vStr(rl.agency,120),phone:vStr(rl.phone,120),email:vStr(rl.email,120),logo:vImg(rl.logo,3e6),copies:Math.max(0,Math.min(1e6,parseInt(rl.copies,10)||0))};
  var cl=s.cl==null?{}:vObj(s.cl);
  out.cl={name:vStr(cl.name,80),lang:LANGS.indexOf(cl.lang)>=0?cl.lang:out.lang,msg:vStr(cl.msg,400)};
  if(s.lay!=null){if(!LAYOUTS.hasOwnProperty(s.lay))throw 0;out.lay=s.lay;}
  if(s.sel!=null){if(SEL_MODES.indexOf(s.sel)<0)throw 0;out.sel=s.sel;}
  out.selRoom=typeof s.selRoom==='string'&&rid[s.selRoom]?s.selRoom:'';
  out.findQ=vStr(s.findQ,120);
  var ph=d.photos==null?{}:vObj(d.photos),photos={};
  Object.keys(photoIds).forEach(function(pid){if(Object.prototype.hasOwnProperty.call(ph,pid)){photos[pid]=vImg(ph[pid],2.5e7);if(!photos[pid])throw 0;}});
  out.boxes.forEach(function(b){b.photos=b.photos.filter(function(p){return photos.hasOwnProperty(p);});});
  return {state:out,photos:photos};
 }catch(err){return null;}
}
/* Transaction-like restore.
   1 validated backup → 2 snapshot old state + old blobs that would be overwritten → 3 write new blobs
   → 4 commit new state (must succeed) → 5 only then delete old unused blobs.
   Any failure: old blobs put back, newly written blobs removed, old state rewritten; S is never touched. */
function rawPhoto(id){return DB.get(PH_PREFIX+id).then(function(v){return v||lsGet(PH_PREFIX+id)||null;});}
function rawPut(id,data){return DB.set(PH_PREFIX+id,data).then(function(ok){return ok||lsSet(PH_PREFIX+id,data);});}
function commitState(st){
 var js=JSON.stringify(st);
 if(DB.db){return DB.set(KEY,JSON.parse(js)).then(function(ok){if(!ok)return false;if(!lsSet(KEY,js))lsDel(KEY);return true;});}
 return Promise.resolve(lsSet(KEY,js));
}
function applyRestore(v){
 clearTimeout(saveT);saveT=null;syncPrinted();
 restoring=true;
 var oldState=clone(S),oldJs=JSON.stringify(S),newState=normalize(clone(v.state));
 var ids=Object.keys(v.photos),written=[],overwritten={},oldIds=[];
 function rollback(){
  return Promise.all(written.map(function(id){delete photoCache[id];lsDel(PH_PREFIX+id);return DB.del(PH_PREFIX+id);}))
  .then(function(){return Promise.all(Object.keys(overwritten).map(function(id){photoCache[id]=overwritten[id];return rawPut(id,overwritten[id]);}));})
  .then(function(){lsSet(KEY,oldJs);return DB.set(KEY,JSON.parse(oldJs));})
  .then(function(){S=oldState;restoring=false;return false;},function(){S=oldState;restoring=false;return false;});
 }
 return storedPhotoIds().then(function(o){oldIds=o;
  /* keep a copy of every existing blob whose id the backup reuses */
  return ids.filter(function(id){return oldIds.indexOf(id)>=0;}).reduce(function(p,id){return p.then(function(ok){if(!ok)return false;
   return rawPhoto(id).then(function(old){if(!old)return false;overwritten[id]=old;return true;});});},Promise.resolve(true));
 }).then(function(ok){
  if(!ok)return false;
  return ids.reduce(function(p,id){return p.then(function(ok2){if(!ok2)return false;
   if(overwritten.hasOwnProperty(id)&&overwritten[id]===v.photos[id]){delete overwritten[id];return true;}
   return DB.set(PH_PREFIX+id,v.photos[id]).then(function(r){if(!r)r=lsSet(PH_PREFIX+id,v.photos[id]);if(r&&!overwritten.hasOwnProperty(id))written.push(id);return r;});});},Promise.resolve(true));
 }).then(function(ok){
  if(!ok)return rollback();
  return commitState(newState).then(function(committed){
   if(!committed)return rollback();
   /* committed: now it is safe to drop blobs the new planner no longer uses */
   oldIds.filter(function(id){return !v.photos.hasOwnProperty(id);}).forEach(phDel);
   photoCache={};S=newState;restoring=false;ED=null;EDorig=null;renderModal();
   return true;
  });
 },function(){return rollback();});
}

/* ---------- full reset ---------- */
function wipeAll(){
 return storedPhotoIds().then(function(ids){
  return Promise.all(ids.map(phDel));
 }).then(function(){
  photoCache={};qrCache={};lsDel(KEY);return DB.del(KEY);
 }).then(function(){
  var l=S.lang;S=freshState(l);S.onboarded=false;ONB={step:1};view='home';fRoom='';fStat='';ED=null;EDorig=null;renderModal();
  return saveNow();
 });
}

 csv:function(){var Y=t('yes');var rows=[[t('box'),t('room'),t('itemName'),t('qty'),t('status'),t('fragile'),t('thisSideUp'),t('openFirst'),t('heavy'),t('hideOnLabel'),t('col_printed'),t('note')]];
  sortedBoxes().forEach(function(b){var rn=roomName(roomById(b.roomId));var its=b.items.length?b.items:[{n:'',q:''}];var pr=isPrinted(b)?Y:'';
   its.forEach(function(i){rows.push([b.no,rn,i.n,i.n?qtyOf(i):'',t('st_'+b.status),b.fragile?Y:'',b.up?Y:'',b.first?Y:'',b.heavy?Y:'',i.hide?Y:'',pr,b.note||'']);});});
  var csv='﻿'+rows.map(function(r){return r.map(function(c){c=String(c==null?'':c);if(/^[=+\-@]/.test(c))c="'"+c;return /[",;\r\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(',');}).join('\r\n');
  download(csv,'moving-inventory-'+iso(new Date())+'.csv','text/csv;charset=utf-8');},
 delTask:function(el){S.tasks=S.tasks.filter(function(x){return x.id!==el.dataset.id;});save();render();},

 delAddr:function(el){S.addr=S.addr.filter(function(x){return x.id!==el.dataset.id;});save();render();},
 addAddr:function(){addFromInput('na',function(v){S.addr.push({id:uid(),text:v.slice(0,300),done:false});});},
 delBud:function(el){S.budget=S.budget.filter(function(x){return x.id!==el.dataset.id;});save();render();},
 addBud:function(){addFromInput('nb',function(v){S.budget.push({id:uid(),text:v.slice(0,300),plan:'',act:''});});},
 addRoom:function(){addFromInput('nr',function(v){var cols=['#C62828','#AD1457','#6A1B9A','#283593','#00695C','#9E9D24','#EF6C00','#4E342E'];S.rooms.push({id:'r_'+uid(),name:v.slice(0,40),color:cols[S.rooms.length%cols.length]});});},
 delRoom:function(el){var id=el.dataset.id;if(S.rooms.length<=1){toast(t('lastRoom'));return;}if(S.boxes.some(function(b){return b.roomId===id;})){toast(t('roomInUse'));return;}S.rooms=S.rooms.filter(function(r){return r.id!==id;});if(S.selRoom===id)S.selRoom='';if(fRoom===id)fRoom='';save();render();},
 mode:function(el){S.mode=el.dataset.v==='realtor'&&!giftOn()?'realtor':'self';save();render();},
 backup:function(){var ids=[];S.boxes.forEach(function(b){ids=ids.concat(b.photos);});
  Promise.all(ids.map(function(id){return phGet(id).then(function(d){return [id,d];},function(){return [id,null];});})).then(function(arr){var ph={},miss=0;arr.forEach(function(p){if(p[1])ph[p[0]]=p[1];else miss++;});
   syncPrinted();
   download(JSON.stringify({app:'spectrtech-moving',v:2,date:new Date().toISOString(),state:S,photos:ph}),'moving-planner-backup-'+iso(new Date())+'.json','application/json');
   if(miss)toast(t('backupMissing',{n:miss}),6000);});},

  var json=JSON.stringify(cfg).replace(/</g,'\\u003c');

  download(out,file,'text/html;charset=utf-8');
  r.copies=(r.copies||0)+1;save();render();toast(t('copyCreated',{file:file}),5000);},
 onbLang:function(el){var l=el.dataset.v;if(LANGS.indexOf(l)<0)return;S.lang=l;lang=l;S.cur=(I18N[l]||I18N.en)._cur;if(!giftOn())S.cl.lang=l;save();render();},
 onbNext:function(){ONB.step=2;renderOnb();},

};
document.addEventListener('click',function(ev){
 var el=ev.target.closest('[data-act]');if(!el)return;
 if(el.disabled||el.getAttribute('aria-disabled')==='true')return;
 if(CFG.demo&&DEMO_LOCK.indexOf(el.dataset.act)>=0){ev.preventDefault();demoBuy();return;}
 var a=ACT[el.dataset.act];if(a){if(el.tagName==='A')ev.preventDefault();a(el,ev);}
});
function focusables(root){return Array.prototype.filter.call(root.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]):not([hidden]),select,textarea,[tabindex]:not([tabindex="-1"])'),function(x){return x.offsetParent!==null||x===document.activeElement;});}
document.addEventListener('keydown',function(ev){
 if(ev.key==='Escape'){var lb=$('.lightbox');if(lb){lb.remove();return;}if(ED){closeModal();return;}}
 if(ev.key==='Tab'){var trap=$('.lightbox')||(ED&&$('#modal .modal'))||(!S.onboarded&&$('#onb .onb-card'));
  if(trap){var f=focusables(trap);if(!f.length){ev.preventDefault();return;}var first=f[0],last=f[f.length-1];
   if(!trap.contains(document.activeElement)){ev.preventDefault();first.focus();}
   else if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus();}
   else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus();}}}
 var tg=ev.target;
 if(ev.key==='Enter'&&tg.dataset&&tg.dataset.enter){ev.preventDefault();var a=ACT[tg.dataset.enter];if(a)a(tg,ev);return;}
 if((ev.key==='Enter'||ev.key===' ')&&tg.getAttribute&&tg.getAttribute('role')==='button'&&tg.dataset.act){ev.preventDefault();tg.click();}
 if(ev.key==='Enter'&&tg.tagName==='IMG'&&tg.dataset.act==='zoom'){ACT.zoom(tg);}
});
document.addEventListener('input',function(ev){
 var el=ev.target,k=el.dataset&&el.dataset.in;if(!k)return;
 if(k==='find'){S.findQ=el.value;$('#results').innerHTML=findResults();save();return;}
 if(!ED)return;
 var i=+el.dataset.i;
 if(k==='itN'){if(ED.items[i])ED.items[i].n=el.value;}
 else if(k==='itQ'){if(ED.items[i])ED.items[i].q=el.value;}
 else if(k==='itH'){if(ED.items[i])ED.items[i].hide=el.checked;}
 else if(k==='flag'){if(['fragile','up','first','heavy'].indexOf(el.dataset.k)>=0)ED[el.dataset.k]=el.checked;}
 else if(k==='no')ED.no=el.value;
 else if(k==='roomId')ED.roomId=el.value;
 else if(k==='status'){if(STATUSES.indexOf(el.value)>=0)ED.status=el.value;}
 else if(k==='note')ED.note=el.value;
});
document.addEventListener('change',function(ev){
 var el=ev.target,k=el.dataset&&el.dataset.ch;if(!k)return;
 var id=el.dataset.id;
 switch(k){
  case 'task':{var x=findById(S.tasks,id);if(x)x.done=el.checked;save();render();break;}
  case 'addr':{var y=findById(S.addr,id);if(y)y.done=el.checked;save();render();break;}
  case 'fRoom':fRoom=el.value;render();break;
  case 'lay':if(LAYOUTS.hasOwnProperty(el.value)){S.lay=el.value;save();render();}break;
  case 'selRoom':S.selRoom=el.value;save();render();break;
  case 'budText':{var b=findById(S.budget,id);if(b){if(b.k&&el.value===t(b.k))break;b.text=el.value.slice(0,300);delete b.k;}save();break;}
  case 'budPlan':{var b2=findById(S.budget,id);if(b2)b2.plan=el.value.slice(0,30);save();render();break;}
  case 'budAct':{var b3=findById(S.budget,id);if(b3)b3.act=el.value.slice(0,30);save();render();break;}
  case 'mv':if(['date','from','to'].indexOf(el.dataset.k)>=0){S.move[el.dataset.k]=el.value.slice(0,200);save();if(el.dataset.k==='date')render();}break;
  case 'lang':if(LANGS.indexOf(el.value)>=0){S.lang=el.value;if(!giftOn()&&!S.cl.name)S.cl.lang=el.value;save();render();}break;
  case 'cur':S.cur=el.value.trim().slice(0,5);save();break;
  case 'roomColor':{var r=findById(S.rooms,id);if(r&&/^#[0-9a-f]{6}$/i.test(el.value)){r.color=el.value;}save();break;}
  case 'roomName':{var r2=findById(S.rooms,id);if(r2){var v=el.value.trim().slice(0,40);if(!(r2.k&&v===roomName(r2))&&v){r2.name=v;delete r2.k;}}save();break;}
  case 'rl':if(['name','agency','phone','email'].indexOf(el.dataset.k)>=0){S.realtor[el.dataset.k]=el.value.slice(0,120);save();render();}break;
  case 'cl':if(['name','lang','msg'].indexOf(el.dataset.k)>=0){S.cl[el.dataset.k]=el.value;save();render();}break;
  case 'logo':{var f=el.files&&el.files[0];el.value='';if(!f||tooBig(f,MAX_LOGO_MB))break;readFile(f).then(function(d){return shrinkImage(d,360,'image/png');}).then(function(d){if(d){S.realtor.logo=d;save();render();}});break;}
  case 'photo':{var files=Array.prototype.slice.call(el.files||[]);el.value='';if(!ED)break;
   var sid=ED._sid; /* photos may only land in the box that was open when the upload started */
   files.reduce(function(p,file){return p.then(function(){
     if(tooBig(file,MAX_PHOTO_MB))return;
     return readFile(file).then(function(d){return shrinkImage(d,1400,'image/jpeg',.8);}).then(function(d){if(!d)return;
      if(!ED||ED._sid!==sid)return;
      var pid=uid();return phSet(pid,d).then(function(ok){if(!ok)return;if(ED&&ED._sid===sid){ED.photos.push(pid);ED._added.push(pid);}else phDel(pid);});});});},Promise.resolve())
   .then(function(){if(ED&&ED._sid===sid)renderModal();});
   break;}
  case 'restore':{var rf=el.files&&el.files[0];el.value='';if(!rf)break;if(CFG.demo){demoBuy();break;}
   if(rf.size>400*1048576){toast(t('badBackup'));break;}
   readFile(rf,true).then(function(txt2){var d=null;try{d=JSON.parse(txt2);}catch(e){}
    var v=d&&validateBackup(d);if(!v){toast(t('badBackup'));return;}
    return applyRestore(v).then(function(ok){if(ok){qrCache={};render();toast(t('restored'));}else toast(t('storageFull'));});
   },function(){toast(t('badBackup'));});break;}
 }
});

 if(s&&s.app==='spectrtech-moving'){S=normalize(s);S.boxes.forEach(function(b){if(b.printed&&!b.printedSig)b.printedSig=labelSig(b);});}
 else{S=CFG.demo?demoSeed():freshState(LANGS.indexOf(CFG.lang)>=0?CFG.lang:detectLang());}
