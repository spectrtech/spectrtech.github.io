# spectrtech.si — статический сайт на Cloudflare Workers (Static Assets).
# Деплой: Cloudflare → Workers & Pages → проект из этого репозитория (Workers Builds), ветка main.
name = "spectrtech-si"
main = "cf/worker.js"
compatibility_date = "2026-06-01"

[assets]
directory = "."
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
# Worker вызывается для всех запросов: статику он отдаёт из assets, а адреса демосайтов (/demo/…, /<slug>, /api/t),
# которых нет в статике, передаёт в систему демо spectrtech.az (см. cf/worker.js и [[services]] ниже).
run_worker_first = true

# Демосайты для международного рынка: та же система демо, что на spectrtech.az (D1 + R2, Lead Monitor).
# Worker spectrtech-az должен быть в том же аккаунте Cloudflare. Без него сайт работает, демо отвечают 404.
[[services]]
binding = "AZ"
service = "spectrtech-az"
