# spectrtech.si — статический сайт на Cloudflare Workers (Static Assets).
# Деплой: Cloudflare → Workers & Pages → проект из этого репозитория (Workers Builds), ветка main.
name = "spectrtech-si"
main = "cf/worker.js"
compatibility_date = "2026-06-01"

[assets]
directory = "."
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
# Worker вызывается только для файлов подтверждения поисковиков
run_worker_first = ["/google*.html", "/yandex_*.html", "/BingSiteAuth.xml"]
